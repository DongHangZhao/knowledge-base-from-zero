name: build-assets

# 多平台发布产物构建（Release assets 用）
# 🔴 2026-11-20 改造：本工作流同时是 **可复用工作流**（workflow_call），
#    `release.yml` 每次发版都会调用它，构建成功后由 release.yml 把 5 个资产
#    直接挂到当次 Release 上。**发版不再依赖「记得手工上传」**——
#    v1.21.0~v1.23.0 连续 4 个版本漏资产，根因就是这一步只存在于人的记忆里。
# 🔴 也可以单独 workflow_dispatch 跑：用于「构建一次、补发所有历史 Release」，
#    产物上传为 Actions artifact 保留 30 天。
# 🔴 二进制是运行时工具、跨版本通用：补历史 Release 时用 master 构建一次即可；
#    源码 zip 则必须按各 tag 单独打（tools/make_release_zip.py --ref <tag>），
#    保证版本内容对应。
#
# 触发：① release.yml 内部调用 ② Actions → build-assets → Run workflow

on:
  workflow_call:
    inputs:
      ref:
        description: "源码 ref（分支或 tag）"
        required: false
        type: string
        default: "master"
  workflow_dispatch:
    inputs:
      ref:
        description: "源码 ref（分支或 tag，默认 master）"
        required: false
        default: "master"

permissions:
  contents: read

jobs:
  # ---------- 1) 源码 zip（供各 Release 按 tag 单独打，这里打当前 ref 的供参考）----------
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 打源码发布包
        run: python tools/make_release_zip.py --out kb-from-zero.zip
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-source-zip
          path: kb-from-zero.zip
          retention-days: 30

  # ---------- 2) 桌面二进制：Windows / Linux / macOS ----------
  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # 资产名必须与 Release 上的名字逐字一致（门禁 tools/release_assets_gate.py 按名核对）
            asset: kb-hub.exe
          - os: ubuntu-latest
            asset: kb-hub-linux
          - os: macos-latest
            asset: kb-hub-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装 PyInstaller
        run: pip install pyinstaller
      - name: 构建（spec 已改为相对路径，跨平台通用）
        shell: bash
        run: |
          cd kb-hub
          python -m PyInstaller --noconfirm --distpath dist --workpath build_ci kb-hub.spec
          ls -la dist/
      - name: 重命名产物
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then SRC="kb-hub/dist/kb-hub.exe"; else SRC="kb-hub/dist/kb-hub"; fi
          cp "$SRC" "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 30

  # ---------- 3) Android APK（p4a webview bootstrap，完整自带后端）----------
  android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: 装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake autopoint ccache cmake g++ gcc git lbzip2 \
            libffi-dev libltdl-dev libtool libssl-dev make patch pkg-config \
            unzip wget zip openjdk-17-jdk
      - name: 装 p4a（锁定 2024.1.21：Python 3.11 + 传统 pyjnius recipe，避开新版 3.14/PEP517 隔离缺 Cython）
        run: pip install --upgrade pip && pip install python-for-android==2024.1.21 cython==3.0.11
      - name: 装 Android SDK/NDK
        run: |
          export ANDROIDSDK="$HOME/android-sdk"
          export ANDROIDNDK="$HOME/android-ndk"
          mkdir -p "$ANDROIDSDK/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROIDSDK/cmdline-tools"
          mv "$ANDROIDSDK/cmdline-tools/cmdline-tools" "$ANDROIDSDK/cmdline-tools/latest"
          yes | "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2" > /dev/null
          # NDK r25c：p4a 最低要求 NDK 25（r23c 被拒）。CPython configure 在 api21
          # target 链接测试要 -lgcc_s，r25c 已移除——由 build_apk.sh 的软链兜底补齐。
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          mv "$HOME/android-ndk-r25c" "$ANDROIDNDK"
          echo "ANDROIDSDK=$ANDROIDSDK" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROIDNDK" >> $GITHUB_ENV
          echo "ANDROIDAPI=33" >> $GITHUB_ENV
          echo "NDKAPI=21" >> $GITHUB_ENV
      - name: 构建 APK
        run: bash kb-hub/android/build_apk.sh
      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-kb-hub-android.apk
          path: kb-hub/dist/kb-hub-android.apk
          retention-days: 30
