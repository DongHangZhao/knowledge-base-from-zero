<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>知识库体系门户 · KB Hub</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2933; --sub:#5b6b7b; --line:#e3e8ef;
    --brand:#2f6df0; --brand2:#16a34a; --warn:#e0a800; --danger:#e0524d; --chip:#eef3ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#2f6df0,#16a34a);
    color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
  header .spacer{flex:1}
  header button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;
    padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  header button:hover{background:rgba(255,255,255,.32)}
  header button.active{background:rgba(255,255,255,.5);font-weight:700}
  header .langsep{opacity:.7;font-size:12px}
  nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:56px;z-index:9}
  nav button{border:1px solid var(--line);background:#fff;color:var(--sub);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:13px}
  nav button.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
  main{padding:18px 20px;max-width:1280px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);
    display:flex;flex-direction:column}
  .card h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card .purpose{color:var(--sub);font-size:12.5px;min-height:24px;flex:1}
  .card .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--brand);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag.s{background:#eafaf0;color:var(--brand2)} .tag.n{background:#fff6e0;color:#b07d00}
  .tag.r{background:#fdecea;color:var(--danger)} .tag.g{background:#eef2f7;color:var(--sub)}
  .card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .card .acts button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--ink)}
  .card .acts button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .card .acts button:hover{filter:brightness(.97)}
  .summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
  .stat .num{font-size:28px;font-weight:800;color:var(--brand)}
  .stat .lab{color:var(--sub);font-size:12.5px;margin-top:2px}
  .section-title{font-size:16px;font-weight:700;margin:16px 0 12px;display:flex;align-items:center;gap:8px}
  .hint{background:#eef3ff;border:1px solid #cfe0ff;color:#274690;padding:10px 14px;border-radius:10px;margin:0 0 14px;font-size:13px}
  .hint.warn{background:#fff6e0;border-color:#f0dca8;color:#8a6100}
  .hint code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px}
  /* 双链路架构 */
  .arch{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .archrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0}
  .archrow+.archrow{border-top:1px dashed var(--line)}
  .archlab{font-size:12px;font-weight:700;color:var(--brand);background:var(--chip);padding:3px 9px;border-radius:8px;white-space:nowrap}
  .archrow:nth-child(2) .archlab{color:var(--brand2);background:#eafaf0}
  .node{background:#f8fbff;border:1px solid #dce8fb;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600;line-height:1.35}
  .node em{display:block;font-style:normal;font-weight:400;color:var(--sub);font-size:11px}
  .arw{color:var(--sub);font-size:14px}
  .archtip{margin-left:auto;font-size:11.5px;color:var(--sub);white-space:nowrap}
  .archnote{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
  .archnote code{background:#eef2f7;padding:1px 5px;border-radius:4px}
  .toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .toolbar input{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;min-width:260px}
  .toolbar select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff}
  .heat-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;margin-bottom:8px}
  .heat-rank{font-size:18px;font-weight:800;color:var(--brand);width:28px;text-align:center}
  .heat-bar{flex:1;height:10px;background:#eef2f7;border-radius:6px;overflow:hidden}
  .heat-bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6df0,#16a34a)}
  .heat-info{flex:2;min-width:200px}
  .heat-info .nm{font-weight:600}
  .heat-info .mt{color:var(--sub);font-size:12px;word-break:break-all}
  .badge-today{background:var(--brand2);color:#fff;font-size:10px;padding:1px 7px;border-radius:8px;margin-left:6px}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .kv .b{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kv .b .e{font-weight:700}.kv .b .c{color:var(--sub)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;
    padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;
    max-width:80vw;word-break:break-all;line-height:1.5}
  .toast.show{opacity:.96}
  .toast.err{background:#b3261e}
  .hidden{display:none}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:20px}
  /* 文件浏览 */
  .crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12.5px}
  .crumbs a{color:var(--brand);cursor:pointer;text-decoration:none}
  .crumbs span.sep{color:var(--sub)}
  .flist{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .frow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #f0f3f8;font-size:13px}
  .frow:last-child{border-bottom:0}
  .frow:hover{background:#f8fbff}
  .frow .nm{flex:1;cursor:pointer;word-break:break-all}
  .frow .nm:hover{color:var(--brand)}
  .frow .sz{color:var(--sub);font-size:12px;width:90px;text-align:right}
  .frow .ic{width:20px;text-align:center}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:14px}
  .dircard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
  .dircard:hover{border-color:var(--brand);background:#f8fbff}
  .dircard .n{font-weight:600;font-size:13px;word-break:break-all}
  .dircard .c{color:var(--sub);font-size:12px}
  /* 工具页 */
  .tpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .tpanel h3{margin:0 0 4px;font-size:15px}
  .tpanel .sub{color:var(--sub);font-size:12.5px;margin-bottom:10px}
  .trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .trow input{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;flex:1;min-width:240px}
  .trow button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  .trow button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tlog{background:#0f172a;color:#c9f7d4;border-radius:10px;padding:12px;margin-top:10px;font-size:12px;
    line-height:1.55;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-all;display:none}
  .tlog.show{display:block}
  .tlog .muted{color:#8aa0b8}
  /* 检索结果 */
  .ragpack{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
  .ragpack pre{background:#f8fbff;border:1px solid #dce8fb;border-radius:8px;padding:10px;font-size:12px;
    white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto}
</style>
</head>

let LANG = (function(){
  try{ const s = localStorage.getItem("kbhub_lang"); if(s === "zh" || s === "en") return s; }catch(e){}
  return (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
})();
function t(k, vars){
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N.zh[k] || k;
  if(vars) for(const v in vars) s = s.split("{" + v + "}").join(String(vars[v]));
  return s;
}
function applyStaticI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.querySelectorAll('[data-act="lang"]').forEach(b => b.classList.toggle("active", b.dataset.lang === LANG));
  document.title = t("docTitle", {s:(INV&&INV.summary||{}).systems||0, k:(INV&&INV.summary||{}).skills||0});
}
function setLang(l){
  if(l !== "zh" && l !== "en") return;
  LANG = l;
  try{ localStorage.setItem("kbhub_lang", l); }catch(e){}
  applyStaticI18n();
  switchTab(CUR_TAB, true);
}

function toast(msg, isErr){
  const t2 = $("#toast"); t2.textContent = msg; t2.classList.toggle("err", !!isErr);
  t2.classList.add("show"); clearTimeout(t2._h); t2._h = setTimeout(()=>t2.classList.remove("show"), isErr ? 4200 : 2200);
}

async function api(path, opt){
  try{
    const r = await fetch(path, opt);
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }catch(e){ toast(t("reqFail", {m:e.message}), true); return null; }
}
const post = (p, body) => api(p, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});

// ---------- 统一动作（全部走 data-*，不再拼 onclick 字符串，避免反斜杠被 JS 吞掉）----------
async function doLaunch(ds){
  const body = {
    id: ds.id || ds.name, name: ds.name || ds.id, kind: ds.kind || "",
    target: ds.target || "", action: ds.action || "open_path"
  };
  const res = await post("/api/launch", body);
  if(!res) return;
  toast((res.ok ? "✅ " : "⚠️ ") + res.msg, !res.ok);
  if(res.top) refreshHeat(res.top);
}
async function doRecord(ds){
  const res = await post("/api/record", {
    id: ds.id || ds.name, name: ds.name || ds.id, kind: ds.kind || "", target: ds.target || ""
  });
  if(res && res.top){ toast(t("recorded")); refreshHeat(res.top); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const ds = b.dataset;
  if(ds.act === "launch") return void doLaunch(ds);
  if(ds.act === "record") return void doRecord(ds);
  if(ds.act === "tab")   return void switchTab(ds.tab);
  if(ds.act === "browse")return void loadBrowse(ds.path);
  if(ds.act === "up")    return void loadBrowse(BROWSE && BROWSE.parent ? BROWSE.parent : KB_ROOT);
  if(ds.act === "refresh") return void loadBrowse(BROWSE ? BROWSE.path : KB_ROOT);
  if(ds.act === "video-dl") return void startVideoDownload();
  if(ds.act === "wx-search") return void runWxSearch();
  if(ds.act === "open-qr")  return void openQrTool();
  if(ds.act === "lang")     return void setLang(ds.lang);
  if(ds.act === "rag-search") return void runRag(false);
  if(ds.act === "rag-ask")    return void runRag(true);
});

function statusTag(st){
  if(st && st.includes("✅")) return `<span class="tag s">${esc(st)}</span>`;
  if(st && st.includes("🆕")) return `<span class="tag n">${esc(st)}</span>`;
  if(st && st.includes("📖")) return `<span class="tag n">${esc(st)}</span>`;
  if(st && st.includes("🔴")) return `<span class="tag r">${esc(st)}</span>`;
  return `<span class="tag">${esc(st || "—")}</span>`;
}

        <button class="primary" data-act="launch" data-id="res:${esc(x.name)}" data-name="${esc(x.name)}" data-kind="resource" data-target="${esc(x.abs_path)}" data-action="open_folder">${t("open")}</button>
        <button data-act="browse" data-path="${esc(x.abs_path)}">${t("browse")}</button>
      </div></div>`;
  });
  h += `</div>`;

  if((INV.zones||[]).length){
    h += `<div class="section-title">${t("zonesTitle", {n:INV.zones.length})}</div><div class="cards">`;
    INV.zones.forEach(z => {
      h += `<div class="card"><h3>${esc(z.name)}</h3>
        <div class="purpose">${esc(z.rel_path)} · ${t("filesN",{n:z.files})}</div>
        <div class="acts">
          <button class="primary" data-act="launch" data-id="zone:${esc(z.rel_path)}" data-name="${esc(z.name)}" data-kind="zone" data-target="${esc(z.abs_path)}" data-action="open_folder">${t("open")}</button>
          <button data-act="browse" data-path="${esc(z.abs_path)}">${t("browse")}</button>
        </div></div>`;
    });
    h += `</div>`;
  }
  $("#tab-resources").innerHTML = h;
}

// ---------- 渲染：文件浏览 ----------
async function loadBrowse(path){
  switchTab("files", true);
  const el = $("#tab-files");
  el.innerHTML = `<div class="hint">${t("reading", {p:esc(path || KB_ROOT)})}</div>`;
  const d = await api("/api/browse?path=" + encodeURIComponent(path || ""));
  BROWSE = d;
  renderBrowse();
}

function renderBrowse(){
  const el = $("#tab-files");
  const d = BROWSE;
  if(!d || !d.ok){
    el.innerHTML = `<div class="hint warn">${t("readFail", {m:esc((d && d.msg) || t("unknown"))})}</div>
      <div class="toolbar"><button class="primary" data-act="browse" data-path="${esc(KB_ROOT)}">${t("backRoot")}</button></div>`;
    return;
  }
  // 面包屑
  const root = KB_ROOT.replace(/\\/g,"/");
  const cur = d.path.replace(/\\/g,"/");
  let crumbs = `<a data-act="browse" data-path="${esc(KB_ROOT)}">${t("crumbRoot")}</a>`;
  if(cur.toLowerCase().startsWith(root.toLowerCase())){
    const rel = cur.slice(root.length).split("/").filter(Boolean);
    let acc = KB_ROOT;
    rel.forEach(seg => { acc += "\\" + seg; crumbs += `<span class="sep">›</span><a data-act="browse" data-path="${esc(acc)}">${esc(seg)}</a>`; });
  }else{
    crumbs += `<span class="sep">›</span><span>${esc(d.path)}</span>`;
  }
  let h = `<div class="crumbs">${crumbs}</div>
    <div class="toolbar">
      <button data-act="up">${t("up")}</button>
      <button data-act="refresh">${t("refresh")}</button>
      <button data-act="launch" data-id="browse-here" data-name="${LANG==="zh"?"当前目录":"Current folder"}" data-kind="folder" data-target="${esc(d.path)}" data-action="open_folder">${t("openExplorer")}</button>
      <span class="tag g">${t("dirsFiles", {d:d.dirs.length, f:d.files.length})}</span>
    </div>`;

  if(d.dirs.length){
    h += `<div class="section-title">${t("dirsTitle", {n:d.dirs.length})}</div><div class="grid2">`;
    d.dirs.forEach(x => {
      h += `<div class="dircard" data-act="browse" data-path="${esc(x.path)}"><div class="n">📁 ${esc(x.name)}</div><div class="c">${t("clickEnter")}</div></div>`;
    });
    h += `</div>`;
  }
  h += `<div class="section-title">${t("filesTitle", {n:d.files.length})}</div>`;
  if(!d.files.length){
    h += `<div class="hint">${t("noFiles")}</div>`;
  }else{
    h += `<div class="flist">`;
    d.files.forEach(f => {
      const ic = /\.(md|txt)$/i.test(f.name) ? "📄" : /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(f.name) ? "🖼️"
        : /\.(mp4|mov|avi|mkv)$/i.test(f.name) ? "🎬" : /\.(mp3|wav|m4a)$/i.test(f.name) ? "🎵"
        : /\.(py|js|ts|bat|ps1|json|html|css)$/i.test(f.name) ? "🧾" : /\.(pdf|docx|xlsx|pptx)$/i.test(f.name) ? "📊" : "📄";
      h += `<div class="frow"><span class="ic">${ic}</span>
        <span class="nm" data-act="launch" data-id="file:${esc(f.path)}" data-name="${esc(f.name)}" data-kind="file" data-target="${esc(f.path)}" data-action="open_file">${esc(f.name)}</span>
        <span class="sz">${fmtSize(f.size)}</span></div>`;
    });
    h += `</div>`;
  }
  el.innerHTML = h;
}

// ---------- 渲染：热度 ----------
function renderHeat(){
  if(!HEAT.length){
    $("#tab-heat").innerHTML = `<div class="hint">${t("heatEmpty")}</div>`;
    return;
  }
  let h = `<div class="hint">${t("heatHint")}</div>`;
  HEAT.forEach((r, i) => {
    const max = HEAT[0].heat || 1;
    const pct = Math.max(4, Math.round(r.heat / max * 100));
    h += `<div class="heat-row">
      <div class="heat-rank">${i+1}</div>
      <div class="heat-bar"><i style="width:${pct}%"></i></div>
      <div class="heat-info"><div class="nm">${esc(r.name)}${r.used_today ? `<span class="badge-today">${t("today")}</span>` : ''}</div>
        <div class="mt">${t("heatMeta", {k:esc(r.kind), h:r.heat, c:r.count, l:esc(r.last || "—")})}</div></div>
      <button class="primary" data-act="launch" data-id="${esc(r.id)}" data-name="${esc(r.name)}" data-kind="${esc(r.kind)}" data-target="${esc(r.target || "")}" data-action="open_path">${t("open")}</button>
      <button data-act="record" data-id="${esc(r.id)}" data-name="${esc(r.name)}" data-kind="${esc(r.kind)}" data-target="${esc(r.target || "")}">${t("record")}</button>
    </div>`;
  });
  $("#tab-heat").innerHTML = h;
}
async function refreshHeat(top){
  HEAT = top || (await api("/api/heat?limit=30")).items || [];
  if(CUR_TAB === "heat") renderHeat();
}

// ---------- 渲染：工具（视频下载 / 微信记录 / 二维码）----------
function renderTools(){
  const dl = (KB_ROOT || "").replace(/[\\/]+$/, "") + "\\modules\\视频下载\\downloads";
  let h = `<div class="hint">${t("toolsHint")}</div>`;

  h += `<div class="tpanel">
    <h3>${t("videoTitle")}</h3>
    <div class="sub">${t("videoSub")}</div>
    <div class="trow">
      <input id="vidUrl" placeholder="${t("videoPh")}">
      <button class="primary" data-act="video-dl">${t("startDl")}</button>
      <button data-act="launch" data-id="video-downloads" data-name="${LANG==="zh"?"视频下载 downloads":"Video downloads"}" data-kind="system" data-target="${esc(dl)}" data-action="open_folder">${t("openDlDir")}</button>
    </div>
    <pre class="tlog" id="vidLog"></pre>
  </div>`;

  h += `<div class="tpanel">
    <h3>${t("wxTitle")}</h3>
    <div class="sub">${t("wxSub")}</div>
    <div class="trow">
      <input id="wxQ" placeholder="${t("wxPh")}">
      <button class="primary" data-act="wx-search">${t("wxSearch")}</button>
      <button data-act="launch" data-id="sys:${LANG==="zh"?"微信聊天记录库":"WeChat logs"}" data-name="${LANG==="zh"?"微信聊天记录库":"WeChat logs"}" data-kind="system" data-target="${esc((KB_ROOT||"") + "\\modules\\微信聊天记录库")}" data-action="open_folder">${t("openModule")}</button>
    </div>
    <pre class="tlog" id="wxLog"></pre>
  </div>`;

  h += `<div class="tpanel">
    <h3>${t("qrTitle")}</h3>
    <div class="sub">${t("qrSub")}</div>
    <div class="trow">
      <button class="primary" data-act="open-qr">${t("openQr")}</button>
      <button data-act="launch" data-id="sys:${LANG==="zh"?"二维码系统":"QR system"}" data-name="${LANG==="zh"?"二维码系统":"QR system"}" data-kind="system" data-target="${esc((KB_ROOT||"") + "\\modules\\二维码系统")}" data-action="open_folder">${t("openModule")}</button>
    </div>
  </div>`;

  $("#tab-tools").innerHTML = h;
}

async function startVideoDownload(){
  const el = $("#vidUrl"), log = $("#vidLog");
  if(!el || !log) return;
  const url = (el.value || "").trim();
  if(!url){ toast(t("needUrl"), true); return; }
  log.classList.add("show"); log.textContent = t("dlRunning");
  const r = await post("/api/tool/video", {url});
  if(!r || !r.ok){ log.textContent = "⚠️ " + ((r && r.msg) || t("dlStartFail")); toast((r && r.msg) || t("dlStartFail"), true); return; }
  for(let i=0;i<500;i++){
    await new Promise(s => setTimeout(s, 1200));
    const st = await api("/api/tool/video/log?tid=" + encodeURIComponent(r.tid));
    if(!st) return;
    log.textContent = st.log || t("noLog");
    log.scrollTop = log.scrollHeight;
    if(st.status !== "running"){
      toast(st.status === "done" ? t("dlDone") : t("dlEnd"), st.status !== "done");
      break;
    }
  }
}

async function runWxSearch(){
  const el = $("#wxQ"), log = $("#wxLog");
  if(!el || !log) return;
  const q = (el.value || "").trim();
  if(!q){ toast(t("needKw"), true); return; }
  log.classList.add("show"); log.textContent = t("searching");
  const r = await post("/api/tool/wx", {q, limit: 20});
  log.textContent = (r && r.ok) ? (r.text || t("noResult")) : ("⚠️ " + ((r && r.msg) || t("needKw")));
  if(r && !r.ok) toast(r.msg || t("needKw"), true);
}

async function openQrTool(){
  toast(t("qrBooting"));
  const r = await post("/api/tool/qr", {});
  if(r && r.ok){ toast(t("qrReady")); window.open(r.url, "_blank"); }
  else toast((r && r.msg) || t("qrFail"), true);
}

// ---------- 渲染：全库检索（三链路 RAG）----------
function renderSearch(){
  $("#tab-search").innerHTML = `<div class="hint">${t("searchHint")}</div>
  <div class="tpanel">
    <h3>${t("searchTitle")}</h3>
    <div class="sub">${t("searchSub")}</div>
    <div class="trow">
      <input id="ragQ" placeholder="${t("ragPh")}">
      <select id="ragMode">
        <option value="fused">${t("modeFused")}</option>
        <option value="kw">${t("modeKw")}</option>
        <option value="vec">${t("modeVec")}</option>
        <option value="substr">${t("modeSubstr")}</option>
      </select>
      <button class="primary" data-act="rag-search">${t("ragSearch")}</button>
      <button data-act="rag-ask">${t("ragAsk")}</button>
    </div>
    <div id="ragResults"></div>
    <pre class="tlog" id="ragLog"></pre>
  </div>`;
  const inp = $("#ragQ");
  if(inp) inp.addEventListener("keydown", ev => { if(ev.key === "Enter") runRag(ev.shiftKey); });
}

async function runRag(ask){
  const el = $("#ragQ"); if(!el) return;
  const q = (el.value || "").trim();
  if(!q){ toast(t("needKw"), true); return; }
  const mode = $("#ragMode") ? $("#ragMode").value : "fused";
  const log = $("#ragLog");
  if(log){ log.classList.add("show"); log.textContent = t("searching"); }
  const r = await post("/api/rag", {q, mode, topk:8, ask:!!ask});
  if(log) log.classList.remove("show");
  if(!r) return;
  if(!r.ok){ if(log){ log.classList.add("show"); log.textContent = t("ragFail", {m:r.msg || "unknown"}) + (r.note ? " ｜ " + r.note : ""); } return; }
  if(ask) renderRagAsk(r); else renderRagHits(r);
}

// note = 后端链路警示（如「全部命中均不含查询关键词，疑似语义擦边」）——零命中风险必须可见
function ragNoteHtml(r){
  return (r && r.note) ? `<div class="hint warn">⚠️ ${esc(r.note)}</div>` : "";
}

function renderRagHits(r){
  const box = $("#ragResults"); if(!box) return;
  const res = r.results || [];
  if(!res.length){ box.innerHTML = ragNoteHtml(r) + `<div class="hint warn">${t("ragNone")}</div>`; return; }
  let h = ragNoteHtml(r);
  res.forEach(x => {
    const p = x.path || "";
    h += `<div class="card">
      <h3>${x.rank}. ${esc(x.title || p)}</h3>
      <div class="purpose">${esc(x.snippet || "")}</div>
      <div class="meta"><span class="tag">${t("score",{s:x.score})}</span>${x.rerank_score!=null?`<span class="tag s" title="Cross-Encoder 精排分">${t("rerankChip",{s:Number(x.rerank_score).toFixed(2)})}</span>`:""}<span class="tag g" title="${esc(p)}">${esc(p)}</span>${(x.matched||[]).map(m=>`<span class="tag n">${esc(m)}</span>`).join("")}</div>
      <div class="acts">
        <button class="primary" data-act="launch" data-id="rag:${esc(p)}" data-name="${esc(x.title || p)}" data-kind="file" data-target="${esc(p)}" data-action="open_file">${t("openFile")}</button>
        <button data-act="record" data-id="rag:${esc(p)}" data-name="${esc(x.title || p)}" data-kind="file" data-target="${esc(p)}">${t("record")}</button>
      </div></div>`;
  });
  box.innerHTML = h;
}

function renderRagAsk(r){
  const box = $("#ragResults"); if(!box) return;
  const ctx = r.context || "";
  const cites = r.citations || [];
  if(!ctx && !cites.length){ box.innerHTML = ragNoteHtml(r) + `<div class="hint warn">${t("ragNone")}</div>`; return; }
  let h = ragNoteHtml(r) + `<div class="ragpack"><div class="section-title">${t("askTitle", {n:cites.length})}</div><pre>${esc(ctx)}</pre></div>`;
  box.innerHTML = h;
}

// ---------- tab 切换 ----------
function switchTab(tab, silent){
  CUR_TAB = tab;
  [...$("#nav").children].forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  ["overview","entries","systems","skills","projects","resources","tools","files","search","heat"].forEach(t => {
    const el = $("#tab-" + t); if(el) el.classList.toggle("hidden", t !== tab);
  });
  if(tab === "entries") renderEntries();
  if(tab === "systems") renderSystems($("#sysSearch") ? $("#sysSearch").value : "");
  if(tab === "skills") renderSkills($("#skSearch") ? $("#skSearch").value : "");
  if(tab === "projects") renderProjects();
  if(tab === "resources") renderResources();
  if(tab === "tools") renderTools();
  if(tab === "files" && !silent) loadBrowse(BROWSE ? BROWSE.path : KB_ROOT);
  if(tab === "search") renderSearch();
  if(tab === "heat") renderHeat();
  window.scrollTo({top:0, behavior:"smooth"});
}

async function init(){
  const inv = await api("/api/inventory");
  const heat = (await api("/api/heat?limit=30")) || {items:[]};
  HEAT = heat.items || [];
  INV = inv || {summary:{},systems:[],skills:[],skill_categories:[],projects:[],resources:[],entries:[],zones:[],sessions:[],file_stats:{}};
  KB_ROOT = INV.kb_root || "";
  applyStaticI18n();
  renderOverview(); renderEntries(); renderSystems(); renderSkills(); renderProjects(); renderResources(); renderTools(); renderSearch(); renderHeat();
  document.title = t("docTitle", {s:(INV.summary||{}).systems||0, k:(INV.summary||{}).skills||0});
  // 支持 #entries / #files / #heat / #tools / #search 直达（便于收藏与分享定位）
  const hash = (location.hash || "").replace("#", "");
  if(hash && document.querySelector(`#nav button[data-tab="${hash}"]`)){
    switchTab(hash);
  }
  // 自检（?selftest=1）：逐个点导航按钮 + 语言切换 + 检索页签，把结果写进 DOM，供 headless 断言
  if(new URLSearchParams(location.search).get("selftest") === "1"){
    const res = [];
    [...$("#nav").children].forEach(b => {
      b.click();
      const t2 = b.dataset.tab;
      res.push({tab:t2, hasAct:b.dataset.act || "", active:b.classList.contains("active"),
                shown:!$("#tab-" + t2).classList.contains("hidden"),
                html:($("#tab-" + t2).innerHTML || "").length});
    });
    switchTab("overview");
    // 语言切换断言：按钮存在、点 EN 导航标签变英文、点回中文恢复
    const langBtns = [...document.querySelectorAll('[data-act="lang"]')];
    const navFirst = () => $("#nav").children[0].textContent;
    const before = navFirst();
    const enBtn = langBtns.find(b => b.dataset.lang === "en");
    const zhBtn = langBtns.find(b => b.dataset.lang === "zh");
    if(enBtn) enBtn.click();
    const afterEn = navFirst();
    if(zhBtn) zhBtn.click();
    res.push({tab:"i18n", langButtons:langBtns.length, switched:before !== afterEn,
              restored:before === navFirst(), enLabel:afterEn});
    res.push({tab:"search", hasAct:!!document.querySelector('#nav button[data-tab="search"]'),
              shown:!$("#tab-search").classList.contains("hidden"),
              html:($("#tab-search").innerHTML || "").length});
    const pre = document.createElement("pre");
    pre.id = "selftest";
    pre.textContent = JSON.stringify(res);
    document.body.appendChild(pre);
  }
}
init();
</script>
